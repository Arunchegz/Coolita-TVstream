<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>TVStream</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#141414">

<script>
(function () {
  // Detect Coolita/Smart-TV before the stylesheet is parsed.
  if (/Coolita|Smart-TV/i.test(navigator.userAgent)) {
    document.documentElement.classList.add('tv');

<style>
:root{--bg:#141414;--surface:#262626;--surface2:#3b3b3b;--text:#fff;--muted:#b3b3b3;--accent:#e50914}
*{box-sizing:border-box;margin:0}
/* Hide the browser cursor only on the TV. Desktop previews keep a normal mouse. */
html.tv,
html.tv *,
html.tv *::before,
html.tv *::after {
  /* Older Coolita Chromium may ignore cursor:none for its native pointer.
     A transparent custom cursor is a second way to hide the browser cursor. */
  cursor: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+/S3sAAAAASUVORK5CYII=") 0 0, none !important;
}
html{font-size:1.25vw;font-size:clamp(12px,1.25vw,26px);background:var(--bg)}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
body{font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--text);background:var(--bg);min-height:100vh;overflow-x:hidden}
.hidden{display:none!important}
#nav{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;padding:1.1rem 3rem 2.6rem;padding:calc(1.1rem + env(safe-area-inset-top)) max(3rem,env(safe-area-inset-right)) 2.6rem max(3rem,env(safe-area-inset-left));background:linear-gradient(rgba(0,0,0,.85),transparent)}
#nav>*+*{margin-left:1.8rem}
.logo{font-size:1.9rem;font-weight:900;letter-spacing:.02em;color:var(--accent);margin-right:1rem}
.navbtn{padding:.3rem .1rem;font-size:1.1rem;color:var(--muted);border-bottom:.15rem solid transparent}
.navbtn:focus{color:#fff;box-shadow:none;transform:none;border-bottom-color:#fff}
#q{margin-left:auto;flex:1 1 8rem;min-width:0;max-width:18rem;padding:.5rem 1rem;border:.1rem solid #555;background:rgba(0,0,0,.6);color:#fff;font-size:1.05rem;border-radius:.2rem}
#q:focus{border-color:#fff;box-shadow:none}
.f{outline:none;cursor:pointer;transition:transform .12s}
.f:focus{box-shadow:0 0 0 .2rem #fff;transform:scale(1.06);z-index:2;position:relative}
input.f:focus{transform:none}
.view{padding:0}
.msg{padding:3rem;color:var(--muted);font-size:1.3rem}
.hero2,.dhero{position:relative;background:center top/cover no-repeat;display:flex;align-items:flex-end}
.hero2{height:62vh;min-height:24rem}
.dhero{height:64vh;min-height:24rem}
.hshade{position:absolute;top:0;right:0;bottom:0;left:0;inset:0;background:linear-gradient(90deg,rgba(20,20,20,.95) 0%,rgba(20,20,20,.55) 42%,transparent 75%),linear-gradient(transparent 55%,var(--bg) 100%)}
.hbody{position:relative;padding:0 3rem 4.5rem;max-width:46rem}
.hbody h1{font-size:3.4rem;line-height:1.05;margin-bottom:.8rem;text-shadow:0 .1rem .6rem rgba(0,0,0,.6)}
.meta{color:#d2d2d2;font-size:1.1rem;margin-bottom:.8rem}
.desc2{font-size:1.15rem;line-height:1.45;margin-bottom:1.3rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 .05rem .3rem rgba(0,0,0,.7)}
.btn{display:inline-block;padding:.7rem 1.8rem;border-radius:.3rem;font-weight:700;font-size:1.2rem;margin:0 .8rem 0 0}
.btn.w{background:#fff;color:#000}
.btn.g{background:rgba(109,109,110,.75);color:#fff}
.btn:focus{box-shadow:0 0 0 .25rem var(--accent)}
.hero2.hidden+#rows,#rows.pad{padding-top:6rem}
.hero2:not(.hidden)+#rows{margin-top:-3.5rem;position:relative}
#rows{padding-bottom:3rem}
.row{margin:0 0 .8rem;padding-left:3rem}
.row h2{font-size:1.25rem;font-weight:600;margin-bottom:.2rem;color:#e5e5e5}
.list{display:flex;overflow:hidden;padding:.9rem .8rem 1.4rem}
.card{flex:0 0 auto;width:9.5rem;margin-right:.9rem}
.card:focus{transform:scale(1.12);box-shadow:none}
.card:focus .poster{box-shadow:0 0 0 .2rem #fff}
.poster{width:100%;aspect-ratio:2/3;border-radius:.3rem;background:var(--surface) center/cover;display:flex;align-items:flex-end;padding:.6rem;font-size:.95rem;overflow:hidden}
.card .t{margin-top:.5rem;font-size:.95rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card:focus .t{color:#fff}
.poster{position:relative}
.poster .progress-track{position:absolute;left:.45rem;right:.45rem;bottom:.35rem;height:.28rem;background:rgba(255,255,255,.4);border-radius:1rem;overflow:hidden}
.poster .progress-track span{display:block;height:100%;background:var(--accent)}
.poster .rm{position:absolute;top:.3rem;right:.3rem;width:2.2rem;height:2.2rem;border-radius:50%;background:rgba(0,0,0,.72);color:#fff;font-size:1.4rem;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;z-index:3;cursor:pointer;transition:transform .12s}
.poster .rm:hover{background:rgba(229,9,20,.92)}
.poster .rm.f:focus{position:absolute;transform:scale(1.12);box-shadow:0 0 0 .2rem #fff;background:var(--accent)}

.dbody{padding:0 3rem 3rem}
.chip{display:inline-block;padding:.45rem 1.1rem;border-radius:.3rem;background:var(--surface);margin:0 .6rem .8rem 0;font-size:1.05rem}
.chip.on{background:#fff;color:#000}

.ep>*+*{margin-left:1.4rem}
.ep .en{font-size:1.6rem;color:var(--muted);width:2.4rem;text-align:center;flex:0 0 auto}
.ep .eth{width:11rem;aspect-ratio:16/9;background:var(--surface) center/cover;border-radius:.3rem;flex:0 0 auto}
.ep .et b{display:block;margin-bottom:.3rem}
.ep .et span{color:var(--muted);font-size:.95rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep:focus{background:var(--surface);transform:none}
.row2{padding:.8rem 1.2rem;background:var(--surface);border-radius:.4rem;margin-bottom:.5rem;font-size:1.1rem}
#streams{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;z-index:25;background:rgba(10,10,10,.92);display:flex;justify-content:center;align-items:flex-start;padding:4rem 0;overflow:auto}
#streams .box{width:56rem;max-width:90vw}
#streams h2{font-size:1.6rem;margin-bottom:1rem}
.st{padding:.9rem 1.2rem;background:var(--surface);border-radius:.4rem;margin-bottom:.5rem;font-size:1.05rem;line-height:1.35}
.st small{display:block;color:var(--muted);margin-top:.2rem}
.st.off{opacity:.45}
/* Dismiss control for remote-only use: fixed to the screen corner so it stays

#streams .xclose:focus{background:var(--accent);box-shadow:0 0 0 .2rem #fff}
#player{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;z-index:20;background:#000;outline:none}
#player video{width:100%;height:100%;object-fit:contain}
video::cue{background:rgba(0,0,0,.7);color:#fff;font-size:var(--subtitle-size,1.4em)}
#ctrls{position:absolute;left:0;right:0;bottom:0;padding:4rem 3rem 1.4rem;background:linear-gradient(transparent,rgba(0,0,0,.85));transition:opacity .25s}
#ctrls.off{opacity:0;pointer-events:none}
#ptop{position:fixed;top:0;left:0;right:0;padding:1.6rem 3rem 4rem;background:linear-gradient(rgba(0,0,0,.8),transparent);display:flex;align-items:center}
#ptop>*+*{margin-left:1.2rem}
#ptitle{font-size:1.2rem;font-weight:600}
.prog{display:flex;align-items:center;margin-bottom:1rem}
.prog>*+*{margin-left:1.2rem}
#bar{flex:1;height:.45rem;background:rgba(255,255,255,.3);border-radius:.25rem;cursor:pointer}
#bar:focus{transform:none;box-shadow:0 0 0 .12rem #fff;height:.7rem}
#fillbar{height:100%;width:0;background:var(--accent);border-radius:.25rem;position:relative}
#fillbar::after{content:"";position:absolute;right:-.55rem;top:50%;width:1.1rem;height:1.1rem;margin-top:-.55rem;border-radius:50%;background:var(--accent)}
#time{font-size:.95rem;min-width:4.5rem;text-align:right}
.cbs{display:flex;align-items:center;justify-content:space-between}
.grp{display:flex;align-items:center}
.grp>*+*{margin-left:.3rem}
.cb>*+*{margin-left:.4rem}
.cb{display:flex;align-items:center;padding:.35rem .55rem;border-radius:.35rem;font-size:.9rem}
.cb svg{width:1.6rem;height:1.6rem;display:block}
.cb:focus{transform:none;box-shadow:0 0 0 .15rem #fff;background:rgba(255,255,255,.18)}
#tracks{position:absolute;top:0;right:0;bottom:0;left:0;inset:0;z-index:3;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:flex-end;padding:0 3rem 8rem}
#tracks .box{width:26rem;max-height:55vh;overflow:auto;background:var(--surface);border-radius:.6rem;padding:1rem}
#tr-title{font-size:1.2rem;margin-bottom:.6rem}
.opt{padding:.6rem .9rem;border-radius:.4rem;font-size:1.05rem;margin-bottom:.2rem}
.opt.on{color:var(--accent)}
.tnote{color:var(--muted);font-size:.95rem;line-height:1.4;padding:.5rem .3rem}
#toast{position:fixed;left:50%;bottom:2.5rem;transform:translateX(-50%);background:var(--surface2);padding:.8rem 1.6rem;border-radius:.6rem;font-size:1.1rem;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}
#settings{padding:6rem 3rem 3rem}
.set input{width:34rem;max-width:100%;padding:.7rem 1rem;border-radius:.4rem;border:0;background:var(--surface);color:var(--text);font-size:1.1rem;margin-right:.8rem}
.set h2{margin:1.6rem 0 .8rem;font-size:1.4rem}
.set p{color:var(--muted);font-size:1rem;line-height:1.5;max-width:44rem;margin-bottom:.8rem}
/* Phone overrides last: media queries add no specificity, so these must come
   after the base rules they replace. */
@media (max-width:700px){
  html{font-size:16px}
  #nav{padding-left:1rem;padding-right:1rem}
  #nav>*+*{margin-left:.6rem}
  #q{margin-left:auto}
  .logo{font-size:1.25rem;margin-right:0}
  .navbtn{font-size:.95rem}
  #ctrls{padding:3.5rem 1rem 1rem}
  #ptop{padding:1rem 1rem 3.2rem}
  #ptitle{font-size:1rem}
  .cbs{flex-wrap:wrap}
  .cbs>.grp{margin-bottom:.4rem}
  .grp{flex-wrap:wrap}
  .cb span{display:none}
  #subtitleTools{margin-left:.2rem}
  #subtitleTools>*+*{margin-left:.2rem}
  #subtitleTools .cb{min-width:2.2rem;font-size:.8rem;justify-content:center}
  #tracks{padding:0 1rem 6rem}
  #tracks .box{width:auto;max-width:92vw}
  #nextOverlay{left:1rem;right:1rem;bottom:7rem;max-width:none}
}
/* Older TV browsers have no aspect-ratio: without this the posters collapse
   to their padding height and every row renders as a sliver. */
@supports not (aspect-ratio: 2 / 3){
  .poster{height:14.25rem}
  .ep .eth{height:6.1875rem}
}
</style>

<body>

</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>

  // Leave browser shortcuts (Ctrl+R, F5, F11, ...) alone.
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(/^F\d+$/.test(k)) return;
  const act = document.activeElement, inInput = act && act.tagName === 'INPUT';
  const back = k === 'Escape' || k === 'BrowserBack' || c === 4 || c === 10009 || c === 461 || (k === 'Backspace' && !inInput);
  if(back && dk && dk.getClientRects().length) toast('Last key: key="' + e.key + '"  keyCode=' + c);
  if(!$('#player').classList.contains('hidden')){
    const inCtrls = ctrlsOn() && act && act.closest && act.closest('#ctrls');
    const playPause = k === ' ' || k === 'MediaPlayPause' || k === 'MediaPlay' || k === 'MediaPause' || c === 415 || c === 179 || c === 85 || c === 126 || c === 127;
    const rewind = k === 'MediaRewind' || c === 89;
    const forward = k === 'MediaFastForward' || c === 90;
    const menuOn = !$('#tracks').classList.contains('hidden');
    const nextOn = !$('#nextOverlay').classList.contains('hidden');
    const srcOn = !$('#streams').classList.contains('hidden');
    if(back){ if(nextOn){ cancelNextAutoplay(); showCtrls(true); } else if(menuOn) closeMenu(); else if(srcOn) closeSources(); else closePlayer(); }
    else if(nextOn){ if(k==='ArrowUp') move('up'); else if(k==='ArrowDown') move('down'); else if(k==='Enter' && act) act.click(); }
    else if(menuOn){ if(k === 'ArrowUp') move('up'); else if(k === 'ArrowDown') move('down'); else if(k === 'Enter' && act) act.click(); }
    else if(srcOn){ if(k === 'ArrowUp') move('up'); else if(k === 'ArrowDown') move('down'); else if(k === 'Enter' && act) act.click(); }
    else if(playPause){ toggle(); showCtrls(); }
    else if(rewind){ seek(-10); showCtrls(); }
    else if(forward){ seek(10); showCtrls(); }
    else if(k === 'f' || k === 'F'){ toggleFullscreen(); showCtrls(); }
    else if(inCtrls){
      if(act.id === 'bar' && (k === 'ArrowLeft' || k === 'ArrowRight')) seek(k === 'ArrowLeft' ? -10 : 10);
      else if(k === 'ArrowLeft') move('left');
      else if(k === 'ArrowRight') move('right');
      else if(k === 'ArrowUp') move('up');
      else if(k === 'ArrowDown') move('down');
      else if(k === 'Enter') act.click();
      if(ctrlsOn()){ clearTimeout(ctrlT); ctrlT = setTimeout(hideCtrls, 4500); }
    }
    else if(k === 'Enter'){ toggle(); showCtrls(); }
    else if(k === 'ArrowRight' || c === 417){ seek(10); showCtrls(); }
    else if(k === 'ArrowLeft' || c === 412){ seek(-10); showCtrls(); }
    else if(k === 'ArrowUp' || k === 'ArrowDown'){ showCtrls(true); }
    e.preventDefault(); return;
  }
  if(back){
    e.preventDefault();
    // The first Back press leaves a text field (and closes the on-screen
    // keyboard) instead of exiting the page.
    if(inInput){ act.blur(); return; }
    goBack(); return;
  }
  const dir = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' }[k];
  if(dir){
    if(inInput && (dir === 'left' || dir === 'right')){
      // Move the caret inside the field; leave it only from the edge.
      const n = act.selectionStart, m = act.selectionEnd, len = (act.value || '').length;
      const atEdge = n === null || (n === m && (dir === 'left' ? n === 0 : n === len));
      if(!atEdge) return;
    }
    e.preventDefault(); move(dir);
  } else if(k === 'Enter'){
    if(act && act.id === 'q'){ search(act.value); }
    else if(act && act.id === 'au'){ e.preventDefault(); const b = $('#aadd'); if(b) b.click(); }
    else if(act && act.classList.contains('f') && !inInput){ e.preventDefault(); act.click(); }
  }
});
$('#exitbtn').onclick = () => { saveProgress(); cancelNextAutoplay(); try { window.close(); } catch(e){} setTimeout(() => toast('Press the Home button on your remote to leave'), 500); };
document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => b.dataset.go === 'home' ? home() : settings());

// Coolita remotes may control the browser as a mouse pointer instead of
// dispatching arrow-key events to the page. Keep DOM focus in sync with the
// item under that pointer, so OK/Enter activates the same item as D-pad mode.
let pointerFocusT = 0, pointerTarget = null, pointerRaf = 0;
const nextFrame = window.requestAnimationFrame ? window.requestAnimationFrame.bind(window) : fn => setTimeout(fn, 16);
function focusPointerTarget(e){
  const t = e.target && e.target.closest ? e.target.closest('.f') : null;
  if(!t || !document.body.contains(t) || !t.getClientRects().length) return;
  // Avoid repeated focus calls from high-frequency mousemove events.
  if(document.activeElement !== t){
    clearTimeout(pointerFocusT);
    pointerFocusT = setTimeout(() => {
      if(document.body.contains(t) && t.getClientRects().length && document.activeElement !== t){
        try { t.focus({ preventScroll: true }); } catch(err) { t.focus(); }
      }
    }, 25);
  }
}
function queuePointerFocus(e){
  pointerTarget = e.target;
  if(pointerRaf) return;
  pointerRaf = nextFrame(() => { pointerRaf = 0; if(pointerTarget) focusPointerTarget({ target: pointerTarget }); });
}
// On Coolita, remote arrow presses can be emulated as mouse movement.
 // Do not let that synthetic pointer steal focus from D-pad tile navigation.
 // Desktop browsers keep the existing pointer-to-focus behaviour.
if (!document.documentElement.classList.contains('tv')) {
  addEventListener('mousemove', queuePointerFocus, true);
  addEventListener('mouseover', queuePointerFocus, true);
  addEventListener('pointermove', queuePointerFocus, true);
}

// Re-apply cursor suppression on Coolita in case its older Chromium engine
// or dynamically-created controls override the stylesheet. This hides the
// webpage cursor only; it cannot hide a pointer drawn by Coolita's system UI.
if (document.documentElement.classList.contains('tv')) {
  function suppressWebCursor(root) {
    try {
      root.style.setProperty('cursor', 'url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+/S3sAAAAASUVORK5CYII=) 0 0, none', 'important');
      if (root.querySelectorAll) {
        const nodes = root.querySelectorAll('*');
        for (let i = 0; i < nodes.length; i++) {
          nodes[i].style.setProperty('cursor', 'url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+/S3sAAAAASUVORK5CYII=) 0 0, none', 'important');
        }
      }
    } catch (e) {}
  }

  suppressWebCursor(document.documentElement);
  if (document.body) suppressWebCursor(document.body);

  // Reapply to newly inserted UI elements, without changing focus or clicks.
  if (typeof MutationObserver === 'function') {
    const cursorObserver = new MutationObserver(records => {
      records.forEach(record => {
        for (let i = 0; i < record.addedNodes.length; i++) {
          const node = record.addedNodes[i];
          if (node && node.nodeType === 1) suppressWebCursor(node);
        }
      });
    });
    cursorObserver.observe(document.documentElement, {
      childList: true,
      subtree: true
    });
  }
}
// Some TV browsers report OK as a key but do not synthesize a DOM click.
// If the pointer is over a focusable app item, activate it on Enter as usual.
// Leaving the app (launcher takeover, screen off) must not leave the decoder
// running: on these boxes that is what produces a dead player on return.
document.addEventListener('visibilitychange', () => {
  if(!document.hidden) return;
  saveProgress();
  cancelNextAutoplay();
  const v = $('#v');
  if(v && !v.paused){ try { v.pause(); } catch(e){} }
});
addEventListener('pagehide', () => { saveProgress(); cancelNextAutoplay(); });

// ---------- start ----------
(async () => {
  // Paint a shell immediately so a slow or unreachable addon cannot leave the
  // screen blank while the manifests are fetched.
  launches = Number(store.get('launches', 0)) + 1; if(!isFinite(launches) || launches < 1) launches = 1; store.set('launches', launches);
  show('home'); homeBuilt = true;
  const shell = '<div id="hero" class="hero2 hidden"></div><div id="rows">';
  // A TV browser old enough to lack fetch() cannot reach any addon. Say so
  // instead of sitting on "Loading addons…" forever with no explanation.
  if(typeof fetch !== 'function'){
    $('#home').innerHTML = shell + '<div class="msg">This browser cannot load addons: it has no fetch() support.<br>Update the TV browser, or open the app in a newer one.</div></div>';
    return;
  }
  $('#home').innerHTML = shell + '<div class="msg">Loading addons…</div></div>';
  await loadAddons();
  home();
})();
</script>

  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./service-worker.js").catch(function (err) {
      console.warn("TVStream offline support unavailable:", err);
    });
  });
}
