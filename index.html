<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TVStream</title>
<style>
:root{--bg:#141414;--surface:#262626;--surface2:#3b3b3b;--text:#fff;--muted:#b3b3b3;--accent:#e50914}
*{box-sizing:border-box;margin:0}
/* TV remote pointer: keep the browser-rendered mouse cursor out of the TV UI. */
html,body,body *{cursor:none!important}
html{font-size:1.25vw;font-size:clamp(12px,1.25vw,26px);background:var(--bg)}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
body{font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--text);background:var(--bg);min-height:100vh;overflow-x:hidden}
.hidden{display:none!important}
#nav{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;padding:1.1rem 3rem 2.6rem;padding:calc(1.1rem + env(safe-area-inset-top)) max(3rem,env(safe-area-inset-right)) 2.6rem max(3rem,env(safe-area-inset-left));background:linear-gradient(rgba(0,0,0,.85),transparent)}
#nav>*+*{margin-left:1.8rem}
.logo{font-size:1.9rem;font-weight:900;letter-spacing:.02em;color:var(--accent);margin-right:1rem}
.navbtn{padding:.3rem .1rem;font-size:1.1rem;color:var(--muted);border-bottom:.15rem solid transparent}
.navbtn:focus{color:#fff;box-shadow:none;transform:none;border-bottom-color:#fff}
#q{margin-left:auto;flex:1 1 8rem;min-width:0;max-width:18rem;padding:.5rem 1rem;border:.1rem solid #555;background:rgba(0,0,0,.6);color:#fff;font-size:1.05rem;border-radius:.2rem}
#q:focus{border-color:#fff;box-shadow:none}
.f{outline:none;cursor:pointer;transition:transform .12s}
.f:focus{box-shadow:0 0 0 .2rem #fff;transform:scale(1.06);z-index:2;position:relative}
input.f:focus{transform:none}
.view{padding:0}
.msg{padding:3rem;color:var(--muted);font-size:1.3rem}
.hero2,.dhero{position:relative;background:center top/cover no-repeat;display:flex;align-items:flex-end}
.hero2{height:62vh;min-height:24rem}
.dhero{height:64vh;min-height:24rem}
.hshade{position:absolute;top:0;right:0;bottom:0;left:0;inset:0;background:linear-gradient(90deg,rgba(20,20,20,.95) 0%,rgba(20,20,20,.55) 42%,transparent 75%),linear-gradient(transparent 55%,var(--bg) 100%)}
.hbody{position:relative;padding:0 3rem 4.5rem;max-width:46rem}
.hbody h1{font-size:3.4rem;line-height:1.05;margin-bottom:.8rem;text-shadow:0 .1rem .6rem rgba(0,0,0,.6)}
.meta{color:#d2d2d2;font-size:1.1rem;margin-bottom:.8rem}
.desc2{font-size:1.15rem;line-height:1.45;margin-bottom:1.3rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 .05rem .3rem rgba(0,0,0,.7)}
.btn{display:inline-block;padding:.7rem 1.8rem;border-radius:.3rem;font-weight:700;font-size:1.2rem;margin:0 .8rem 0 0}
.btn.w{background:#fff;color:#000}
.btn.g{background:rgba(109,109,110,.75);color:#fff}
.btn:focus{box-shadow:0 0 0 .25rem var(--accent)}
.hero2.hidden+#rows,#rows.pad{padding-top:6rem}
.hero2:not(.hidden)+#rows{margin-top:-3.5rem;position:relative}
#rows{padding-bottom:3rem}
.row{margin:0 0 .8rem;padding-left:3rem}
.row h2{font-size:1.25rem;font-weight:600;margin-bottom:.2rem;color:#e5e5e5}
.list{display:flex;overflow:hidden;padding:.9rem .8rem 1.4rem}
.card{flex:0 0 auto;width:9.5rem;margin-right:.9rem}
.card:focus{transform:scale(1.12);box-shadow:none}
.card:focus .poster{box-shadow:0 0 0 .2rem #fff}
.poster{width:100%;aspect-ratio:2/3;border-radius:.3rem;background:var(--surface) center/cover;display:flex;align-items:flex-end;padding:.6rem;font-size:.95rem;overflow:hidden}
.card .t{margin-top:.5rem;font-size:.95rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card:focus .t{color:#fff}
.poster{position:relative}
.poster .progress-track{position:absolute;left:.45rem;right:.45rem;bottom:.35rem;height:.28rem;background:rgba(255,255,255,.4);border-radius:1rem;overflow:hidden}
.poster .progress-track span{display:block;height:100%;background:var(--accent)}
.poster .rm{position:absolute;top:.3rem;right:.3rem;width:2.2rem;height:2.2rem;border-radius:50%;background:rgba(0,0,0,.72);color:#fff;font-size:1.4rem;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;z-index:3;cursor:pointer;transition:transform .12s}
.poster .rm:hover{background:rgba(229,9,20,.92)}
.poster .rm.f:focus{position:absolute;transform:scale(1.12);box-shadow:0 0 0 .2rem #fff;background:var(--accent)}
#nextOverlay{position:absolute;right:3rem;bottom:9rem;z-index:4;background:rgba(25,25,25,.94);padding:1rem 1.2rem;border-radius:.5rem;max-width:24rem}
#nextOverlay strong{display:block;margin-bottom:.6rem}
#nextOverlay .btn{font-size:1rem;margin-top:.4rem}
#subtitleTools{display:flex;align-items:center;margin-left:.5rem}
#subtitleTools>*+*{margin-left:.35rem}
#subtitleTools .cb{background:rgba(255,255,255,.12);min-width:2.5rem;justify-content:center}
.dbody{padding:0 3rem 3rem}
.chip{display:inline-block;padding:.45rem 1.1rem;border-radius:.3rem;background:var(--surface);margin:0 .6rem .8rem 0;font-size:1.05rem}
.chip.on{background:#fff;color:#000}
.ep{display:flex;align-items:center;padding:.9rem 1.2rem;border-radius:.3rem;border-bottom:.05rem solid #333;font-size:1.1rem}
.ep>*+*{margin-left:1.4rem}
.ep .en{font-size:1.6rem;color:var(--muted);width:2.4rem;text-align:center;flex:0 0 auto}
.ep .eth{width:11rem;aspect-ratio:16/9;background:var(--surface) center/cover;border-radius:.3rem;flex:0 0 auto}
.ep .et b{display:block;margin-bottom:.3rem}
.ep .et span{color:var(--muted);font-size:.95rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep:focus{background:var(--surface);transform:none}
.row2{padding:.8rem 1.2rem;background:var(--surface);border-radius:.4rem;margin-bottom:.5rem;font-size:1.1rem}
#streams{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;z-index:25;background:rgba(10,10,10,.92);display:flex;justify-content:center;align-items:flex-start;padding:4rem 0;overflow:auto}
#streams .box{width:56rem;max-width:90vw}
#streams h2{font-size:1.6rem;margin-bottom:1rem}
.st{padding:.9rem 1.2rem;background:var(--surface);border-radius:.4rem;margin-bottom:.5rem;font-size:1.05rem;line-height:1.35}
.st small{display:block;color:var(--muted);margin-top:.2rem}
.st.off{opacity:.45}
/* Dismiss control for remote-only use: fixed to the screen corner so it stays
   put while the source list scrolls. */
#streams .xclose{position:fixed;top:3.4rem;right:3.4rem;width:2.8rem;height:2.8rem;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:1.5rem;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;z-index:2}
#streams .xclose:focus{background:var(--accent);box-shadow:0 0 0 .2rem #fff}
#player{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;z-index:20;background:#000}
#player video{width:100%;height:100%;object-fit:contain}
video::cue{background:rgba(0,0,0,.7);color:#fff;font-size:var(--subtitle-size,1.4em)}
#ctrls{position:absolute;left:0;right:0;bottom:0;padding:4rem 3rem 1.4rem;background:linear-gradient(transparent,rgba(0,0,0,.85));transition:opacity .25s}
#ctrls.off{opacity:0;pointer-events:none}
#ptop{position:fixed;top:0;left:0;right:0;padding:1.6rem 3rem 4rem;background:linear-gradient(rgba(0,0,0,.8),transparent);display:flex;align-items:center}
#ptop>*+*{margin-left:1.2rem}
#ptitle{font-size:1.2rem;font-weight:600}
.prog{display:flex;align-items:center;margin-bottom:1rem}
.prog>*+*{margin-left:1.2rem}
#bar{flex:1;height:.45rem;background:rgba(255,255,255,.3);border-radius:.25rem;cursor:pointer}
#bar:focus{transform:none;box-shadow:0 0 0 .12rem #fff;height:.7rem}
#fillbar{height:100%;width:0;background:var(--accent);border-radius:.25rem;position:relative}
#fillbar::after{content:"";position:absolute;right:-.55rem;top:50%;width:1.1rem;height:1.1rem;margin-top:-.55rem;border-radius:50%;background:var(--accent)}
#time{font-size:.95rem;min-width:4.5rem;text-align:right}
.cbs{display:flex;align-items:center;justify-content:space-between}
.grp{display:flex;align-items:center}
.grp>*+*{margin-left:.3rem}
.cb>*+*{margin-left:.4rem}
.cb{display:flex;align-items:center;padding:.35rem .55rem;border-radius:.35rem;font-size:.9rem}
.cb svg{width:1.6rem;height:1.6rem;display:block}
.cb:focus{transform:none;box-shadow:0 0 0 .15rem #fff;background:rgba(255,255,255,.18)}
#tracks{position:absolute;top:0;right:0;bottom:0;left:0;inset:0;z-index:3;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:flex-end;padding:0 3rem 8rem}
#tracks .box{width:26rem;max-height:55vh;overflow:auto;background:var(--surface);border-radius:.6rem;padding:1rem}
#tr-title{font-size:1.2rem;margin-bottom:.6rem}
.opt{padding:.6rem .9rem;border-radius:.4rem;font-size:1.05rem;margin-bottom:.2rem}
.opt.on{color:var(--accent)}
.tnote{color:var(--muted);font-size:.95rem;line-height:1.4;padding:.5rem .3rem}
#toast{position:fixed;left:50%;bottom:2.5rem;transform:translateX(-50%);background:var(--surface2);padding:.8rem 1.6rem;border-radius:.6rem;font-size:1.1rem;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}
#settings{padding:6rem 3rem 3rem}
.set input{width:34rem;max-width:100%;padding:.7rem 1rem;border-radius:.4rem;border:0;background:var(--surface);color:var(--text);font-size:1.1rem;margin-right:.8rem}
.set h2{margin:1.6rem 0 .8rem;font-size:1.4rem}
.set p{color:var(--muted);font-size:1rem;line-height:1.5;max-width:44rem;margin-bottom:.8rem}
/* Phone overrides last: media queries add no specificity, so these must come
   after the base rules they replace. */
@media (max-width:700px){
  html{font-size:16px}
  #nav{padding-left:1rem;padding-right:1rem}
  #nav>*+*{margin-left:.6rem}
  #q{margin-left:auto}
  .logo{font-size:1.25rem;margin-right:0}
  .navbtn{font-size:.95rem}
  #ctrls{padding:3.5rem 1rem 1rem}
  #ptop{padding:1rem 1rem 3.2rem}
  #ptitle{font-size:1rem}
  .cbs{flex-wrap:wrap}
  .cbs>.grp{margin-bottom:.4rem}
  .grp{flex-wrap:wrap}
  .cb span{display:none}
  #subtitleTools{margin-left:.2rem}
  #subtitleTools>*+*{margin-left:.2rem}
  #subtitleTools .cb{min-width:2.2rem;font-size:.8rem;justify-content:center}
  #tracks{padding:0 1rem 6rem}
  #tracks .box{width:auto;max-width:92vw}
  #nextOverlay{left:1rem;right:1rem;bottom:7rem;max-width:none}
}
/* Older TV browsers have no aspect-ratio: without this the posters collapse
   to their padding height and every row renders as a sliver. */
@supports not (aspect-ratio: 2 / 3){
  .poster{height:14.25rem}
  .ep .eth{height:6.1875rem}
}
</style>

/* Coolita cursor experiment: transparent cursor image; navigation/focus logic unchanged */
html, body, body *, body *::before, body *::after {
  cursor: url("data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=") 0 0, none !important;
}

<body>
<div id="nav">
  <div class="logo">TVStream</div>
  <div class="f navbtn" data-go="home" tabindex="0" role="button" aria-label="Home">Home</div>
  <div class="f navbtn" data-go="settings" tabindex="0" role="button" aria-label="Addons">Addons</div>
  <div class="f navbtn" id="exitbtn" tabindex="0" role="button" aria-label="Exit app">Exit</div>
  <input id="q" class="f" placeholder="Search" tabindex="0" aria-label="Search titles">
</div>
<main>
  <section id="home" class="view"></section>
  <section id="detail" class="view hidden"></section>
  <section id="settings" class="view hidden set"></section>
</main>
<div id="streams" class="hidden" role="dialog" aria-modal="true" aria-labelledby="st-title"><div class="f xclose" id="st-close" tabindex="0" role="button" aria-label="Close sources">&#10005;</div><div class="box"><h2 id="st-title"></h2><div id="st-list"></div></div></div>
<div id="player" class="hidden"><video id="v" playsinline></video>
  <div id="ctrls" class="off">
    <div id="ptop"><div class="f cb" id="cclose" tabindex="0" role="button" aria-label="Close player"></div><div id="ptitle"></div></div>
    <div class="prog"><div class="f" id="bar" tabindex="0" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="fillbar"></div></div><div id="time">0:00</div></div>
    <div class="cbs">
      <div class="grp">
        <div class="f cb" id="cplay" tabindex="0" role="button" aria-label="Play or pause"></div>
        <div class="f cb" id="cback" tabindex="0" role="button" aria-label="Back 10 seconds"></div>
        <div class="f cb" id="cfwd" tabindex="0" role="button" aria-label="Forward 10 seconds"></div>
        <div class="f cb" id="cmute" tabindex="0" role="button" aria-label="Mute or unmute"></div>
        <div class="f cb" id="cfs" tabindex="0" role="button" aria-label="Enter fullscreen"></div>
      </div>
      <div class="grp">
        <div class="f cb" id="caudio" tabindex="0" role="button" aria-label="Audio tracks"></div>
        <div class="f cb" id="csubs" tabindex="0" role="button" aria-label="Subtitles"></div>
        <div class="f cb" id="csrc" tabindex="0" role="button" aria-label="Sources"></div>
        <div id="subtitleTools">
          <div class="f cb" id="subSmaller" tabindex="0" role="button" title="Smaller subtitles" aria-label="Smaller subtitles">A−</div>
          <div class="f cb" id="subLarger" tabindex="0" role="button" title="Larger subtitles" aria-label="Larger subtitles">A+</div>
          <div class="f cb" id="subDelayMinus" tabindex="0" role="button" title="Subtitles earlier" aria-label="Subtitles earlier">−0.5s</div>
          <div class="f cb" id="subDelayPlus" tabindex="0" role="button" title="Subtitles later" aria-label="Subtitles later">+0.5s</div>
        </div>
      </div>
    </div>
  </div>
  <div id="tracks" class="hidden" role="dialog" aria-modal="true" aria-labelledby="tr-title"><div class="box"><h2 id="tr-title"></h2><div id="tr-list"></div></div></div>
  <div id="nextOverlay" class="hidden"><strong id="nextTitle">Next episode</strong><div class="f btn w" id="nextPlay" tabindex="0" role="button">▶ Next episode</div><div class="f btn g" id="nextCancel" tabindex="0" role="button">Cancel autoplay</div></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
// hls.js is loaded from beside this file when a copy is deployed there, so the
// app has no hard dependency on a third-party CDN. Falls back to cdnjs when the
// local copy is missing.
(function(){
  var d = document, s = d.createElement('script');
  s.src = 'hls.min.js';
  s.onerror = function(){
    var c = d.createElement('script');
    c.src = 'https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js';
    d.head.appendChild(c);
  };
  d.head.appendChild(s);
})();
</script>
<script>
// Addons installed on first launch. Add your own manifest URLs here.
const PRESET = ['https://v3-cinemeta.strem.io/manifest.json'];

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const base = u => u.trim().replace(/^stremio:/, 'https:').replace(/\/manifest\.json$/, '').replace(/\/$/, '');
const enc = id => encodeURIComponent(id).replace(/%3A/gi, ':');
async function j(u, ms){
  // AbortController is absent on some TV browsers: keep the call working,
  // just without the ability to cancel the request.
  const ctl = typeof AbortController === 'function' ? new AbortController() : null;
  const to = ctl ? setTimeout(() => ctl.abort(), ms || 12000) : null;
  try {
    const r = await fetch(u, ctl ? { signal: ctl.signal } : undefined);
    if(!r.ok) throw new Error(r.status);
    return await r.json();
  } finally { if(to) clearTimeout(to); }
}
async function fetchText(u, ms){
  const ctl = typeof AbortController === 'function' ? new AbortController() : null;
  const to = ctl ? setTimeout(() => ctl.abort(), ms || 12000) : null;
  try {
    const r = await fetch(u, ctl ? { signal: ctl.signal } : undefined);
    if(!r.ok) throw new Error(r.status);
    return await r.text();
  } finally { if(to) clearTimeout(to); }
}
let toastT;
function toast(t){ const e = $('#toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('show'), 3200); }

let addons = [], cur = 'home';
const progressKey = 'tvstream.progress.v1';
const progressAll = () => store.get(progressKey, {});
const progressId = (type, id) => type + ':' + id;
function saveProgress(){
  const v = $('#v');
  if(!lastStream || !lastStream.id || !isFinite(v.duration) || v.duration <= 0) return;
  const all = progressAll(), key = progressId(lastStream.type, lastStream.id);
  const done = v.ended || v.currentTime >= v.duration - 20;
  if(done) delete all[key];
  else all[key] = { type:lastStream.type, id:lastStream.id, title:$('#ptitle').textContent,
    position:v.currentTime, duration:v.duration, poster:lastStream.poster || '', updated:Date.now(),
    nextEpisode:lastStream.nextEpisode || null };
  store.set(progressKey, all);
}
function resumePosition(type,id){
  const item = progressAll()[progressId(type,id)];
  return item && item.duration && item.position / item.duration < .95 ? item.position : 0;
}
function removeProgress(type, id){
  const all = progressAll(), key = progressId(type, id);
  if(!(key in all)) return false;
  delete all[key];
  store.set(progressKey, all);
  return true;
}
function renderContinueRow(){
  const items = Object.values(progressAll()).filter(x => x && x.duration && x.position > 3 && x.position/x.duration < .95).sort((a,b)=>b.updated-a.updated);
  if(!items.length) return;
  const row = mkRow('Continue Watching');
  const R = $('#rows'); if(!R) return;
  R.prepend(row.el);
  items.slice(0,20).forEach(item => {
    const c=document.createElement('div'); c.className='f card'; c.tabIndex=0; c.setAttribute('role','button');
    const pct=Math.max(0,Math.min(100,item.position/item.duration*100));
    const left = Math.max(0, item.duration - item.position);
    const poster=document.createElement('div'); poster.className='poster';
    setBg(poster, item.poster);
    if(!item.poster) poster.textContent = item.title || '';
    const rm=document.createElement('div'); rm.className='f rm'; rm.tabIndex=0; rm.setAttribute('role','button');
    rm.setAttribute('aria-label','Remove ' + (item.title || 'this item') + ' from Continue Watching');
    rm.textContent='\u2715';
    rm.onclick=(ev)=>{
      ev.preventDefault(); ev.stopPropagation();
      if(!removeProgress(item.type, item.id)) return;
      const sib = c.nextElementSibling || c.previousElementSibling;
      c.remove();
      if(!row.list.children.length){
        row.el.remove();
        const f = document.querySelector('#rows .f'); if(f) f.focus();
      } else if(sib && sib.focus) sib.focus();
      toast('Removed from Continue Watching');
    };
    poster.appendChild(rm);
    const track=document.createElement('div'); track.className='progress-track';
    const span=document.createElement('span'); span.style.width=pct+'%';
    track.appendChild(span); poster.appendChild(track);
    const t=document.createElement('div'); t.className='t';
    t.innerHTML = esc(item.title) + '<br>' + esc(fmt(left)) + ' left of ' + esc(fmt(item.duration));
    c.appendChild(poster); c.appendChild(t);
    c.setAttribute('aria-label', item.title + ', ' + fmt(left) + ' left');
    c.onclick=()=>{ pendingResume = item.position; streams(item.type,item.id,item.title,item); };
    row.list.appendChild(c);
  });
  hydrateBg(row.list);
}
let pendingResume = null;
let nextTimer = null, subtitleSize = Number(store.get('subtitleSize',1.4)), subtitleDelay = Number(store.get('subtitleDelay',0));
function applySubtitleSize(){ document.documentElement.style.setProperty('--subtitle-size',subtitleSize+'em'); }
applySubtitleSize();

// ---------- addons ----------
function getUrls(){
  let urls = store.get('urls', null);
  if(!urls){ urls = PRESET.slice(); }
  const p = new URLSearchParams(location.search).getAll('addon');
  p.forEach(u => { if(!urls.map(base).includes(base(u))) urls.push(u); });
  store.set('urls', urls);
  return urls;
}
// If localStorage was wiped (the Coolita guide says cache does not outlive the
// app), start from an optional config.json beside this file:
// { "addons": ["https://.../manifest.json"] }
async function loadDefaults(){
  if(store.get('urls', null)) return;
  try {
    const c = await j('config.json', 4000);
    if(c && Array.isArray(c.addons)){
      const list = c.addons.filter(u => typeof u === 'string' && u);
      if(list.length) store.set('urls', list);
    }
  } catch(e){}
}
async function loadAddons(){
  await loadDefaults();
  const urls = getUrls(); addons = [];
  await Promise.all(urls.map(async u => {
    try { const b = base(u); addons.push({ u, b, m: await j(b + '/manifest.json', 8000) }); } catch(e){}
  }));

async function home(){

async function streams(type, id, title, opts){

    poster: opts.poster || window.currentMediaPoster || '',

    epList: opts.epList || null, epIndex: opts.epIndex == null ? null : opts.epIndex,
    seriesName: opts.seriesName || '',

  $('#streams').classList.remove('hidden');
  $('#st-title').textContent = title;
  const L = $('#st-list'); L.innerHTML = '<div class="msg">Looking for sources…</div>';
  const wasPlaying = !$('#player').classList.contains('hidden');
  const as = addons.filter(a => supports(a.m, 'stream', type, id));
  currentSources = []; currentSrcIdx = -1;
  if(!as.length){ L.innerHTML = '<div class="msg">None of your addons provide streams for this title. Add a stream addon in Addons.</div>'; return; }

  // Keep sources in arrival order so their indexes never change while other
  // addons are still responding. Start the first browser-ready source as soon
  // as it arrives instead of waiting for every addon (one slow addon can hang).

    if(g !== streamsGen) return;

    if(!autoStarted){
      const first = currentSources.findIndex(playable);
      if(first >= 0){

    }

    try {
      const d = await j(a.b + '/stream/' + type + '/' + enc(id) + '.json', 25000);

        if(s && (s.url || s.externalUrl)) found.push({ s, addon:a });

// Match a saved preference against a track list: exact code first, then
// prefix, then name. A plain substring test would match "Slovenian" for "en".
function matchPref(tracks, pref, langOf, nameOf){
  const p = String(pref || '').toLowerCase().trim();
  if(!p || !tracks.length) return -1;
  let i = tracks.findIndex(t => String(langOf(t) || '').toLowerCase() === p);
  if(i >= 0) return i;
  i = tracks.findIndex(t => String(langOf(t) || '').toLowerCase().startsWith(p));
  if(i >= 0) return i;
  i = tracks.findIndex(t => String(nameOf(t) || '').toLowerCase().startsWith(p));
  if(i >= 0) return i;
  return tracks.findIndex(t => (String(langOf(t) || '') + ' ' + String(nameOf(t) || '')).toLowerCase().includes(p));
}
function applyPreferredTracks(){

      if(i >= 0) hls.audioTrack = i;
    }
    else if(v.audioTracks && v.audioTracks.length){
      const list = Array.from(v.audioTracks);
      const i = matchPref(list, pref, t => t.language, t => t.label);
      if(i >= 0) list.forEach((t,k) => t.enabled = k === i);
    }

    if(i >= 0) it={kind:'hls',i};

function play(s, title){

  lastStream.resumeAt = null;

// Subtitle timing: cues parsed after the button press (or after a source
// change) must be offset too, so the delay is re-applied whenever cues change.
const cueBase = new WeakMap(), trackSeen = new WeakMap();
function applyDelayToTrack(t){
  if(!t || !t.cues || !t.cues.length) return;
  const cues = Array.from(t.cues);
  if(trackSeen.get(t) === cues.length) return;
  trackSeen.set(t, cues.length);
  cues.forEach(c => {
    // The unshifted base time is kept per cue object, so a cue that is
    // replaced later is offset exactly once.
    let b = cueBase.get(c);
    if(!b){ b = { s:c.startTime, e:c.endTime }; cueBase.set(c, b); }
    c.startTime = Math.max(0, b.s + subtitleDelay);
    c.endTime = Math.max(c.startTime + .05, b.e + subtitleDelay);
  });
}
function applySubtitleDelay(force){
  Array.from($('#v').textTracks).forEach(t => { if(force) trackSeen.delete(t); applyDelayToTrack(t); });
}

      clearTimeout(removeT); pendingRemove = -1;
      const n = store.get('urls', []); n.splice(i, 1); store.set('urls', n);
      await loadAddons(); settings(); toast('Addon removed');
    };
    list.appendChild(d);
  });
  $('#aadd').onclick = async () => {
    const val = $('#au').value.trim(); if(!val) return;
    try {
      const b = base(val); const m = await j(b + '/manifest.json', 12000);
      const n = store.get('urls', []); n.push(b + '/manifest.json'); store.set('urls', n);
      await loadAddons(); settings(); toast('Installed ' + (m.name || 'addon'));
    } catch(e){ toast('Could not load that addon. Check the link.'); }
  };
  $('#diag').onclick = renderDiag; renderDiag();
  $('#au').focus();
}

// ---------- remote control ----------
function scope(){
  if(!$('#tracks').classList.contains('hidden')) return '#tracks .f';
  if(!$('#nextOverlay').classList.contains('hidden')) return '#nextOverlay .f';
  if(!$('#streams').classList.contains('hidden')) return '#streams .f';
  if(!$('#player').classList.contains('hidden')) return '#ctrls .f';
  return '#nav .f, .view:not(.hidden) .f';
}
function move(dir){
  const cur = document.activeElement;
  const els = Array.from(document.querySelectorAll(scope())).filter(e => e.offsetParent);
  if(!cur || !els.includes(cur)){ if(els[0]) els[0].focus(); return; }
  const r = cur.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let best = null, bs = 1e9;
  els.forEach(e => {
    if(e === cur) return;
    const q = e.getBoundingClientRect(), dx = q.left + q.width / 2 - cx, dy = q.top + q.height / 2 - cy;
    const ok = dir === 'left' ? dx < -4 : dir === 'right' ? dx > 4 : dir === 'up' ? dy < -4 : dy > 4;
    if(!ok) return;
    const horiz = dir === 'left' || dir === 'right';
    const s = (horiz ? Math.abs(dx) : Math.abs(dy)) + (horiz ? Math.abs(dy) : Math.abs(dx)) * 3;
    if(s < bs){ bs = s; best = e; }
  });
  if(best){ best.focus(); if(best.closest('#nav, #hero, .dhero')) window.scrollTo(0, 0); else best.scrollIntoView({ block: 'center', inline: 'center' }); }
}
function goBack(){
  if(!$('#streams').classList.contains('hidden')){ closeSources(); return; }
  if(searchActive && cur === 'home'){ searchActive = false; home(); return; }
  if(cur !== 'home'){ if(homeBuilt){ show('home'); if(lastFocus && document.body.contains(lastFocus)){ lastFocus.focus(); lastFocus.scrollIntoView({ block: 'center' }); } } else home(); return; }
  // Already at the root. The Coolita integration guide specifies window.close()
  // as the way to leave an H5 app and return to the launcher. Browsers that
  // refuse (any window not opened by script) simply ignore it.
  try { window.close(); } catch(e){}
}
// TV browsers frequently deliver only a numeric keyCode, sometimes with
// e.key left as 'Unidentified'. Map the codes back onto the names the rest
// of the handler understands.
let launches = 0;
function flexGap(){
  const d = document.createElement('div');
  d.style.cssText = 'display:flex;flex-direction:column;row-gap:1px;position:absolute;visibility:hidden';
  d.appendChild(document.createElement('span')); d.appendChild(document.createElement('span'));
  document.body.appendChild(d);
  const ok = d.scrollHeight === 1;
  document.body.removeChild(d);
  return ok;
}
function renderDiag(){
  const el = $('#diag'); if(!el) return;
  const ua = navigator.userAgent, m = /Chrome\/(\d+)/.exec(ua);
  const rows = [
    ['Engine', m ? 'Chrome ' + m[1] : 'unknown'],
    ['Coolita UA', /Coolita/i.test(ua) ? 'yes' : 'no'],
    ['Flex gap', flexGap() ? 'yes' : 'no (layout uses margins)'],
    ['Intl.DisplayNames', (typeof Intl !== 'undefined' && Intl.DisplayNames) ? 'yes' : 'no (built-in table)'],
    ['Video engine', (window.MediaSource ? 'MSE yes' : 'MSE no') + ' / ' + (window.Hls ? (Hls.isSupported() ? 'hls.js ready' : 'hls.js unsupported') : 'hls.js not loaded')],
    ['Fullscreen API', (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen) ? 'yes' : 'no'],
    ['Storage', 'app opened ' + launches + ' time(s) on record (stuck at 1 = not persisting)'],
    ['Screen', innerWidth + 'x' + innerHeight + ' @' + (window.devicePixelRatio || 1) + 'x'],
    ['JS memory', (window.performance && performance.memory) ? Math.round(performance.memory.usedJSHeapSize / 1048576) + ' MB' : 'n/a']
  ];
  el.innerHTML = rows.map(r => '<div><b>' + esc(r[0]) + ':</b> ' + esc(r[1]) + '</div>').join('') +
    '<div style="margin-top:.5rem;color:var(--muted);font-size:.9rem;word-break:break-all">' + esc(ua) + '</div>' +
    '<div id="diagKey" style="margin-top:.5rem;color:var(--muted)">Press any remote key (try Back) to see its code. OK refreshes.</div>';
}
const TV_KEYS = { 37: 'ArrowLeft', 38: 'ArrowUp', 39: 'ArrowRight', 40: 'ArrowDown', 13: 'Enter', 8: 'Backspace', 27: 'Escape' };
addEventListener('click', e => {
  const t = e.target && e.target.closest ? e.target.closest('.f') : null;
  if(t && t.focus){ try { t.focus({ preventScroll: true }); } catch(err) { t.focus(); } }
}, true);
// Optional Coolita cursor-hide experiment. Use the on-screen button with the remote OK button.
// Pointer Lock is opt-in because it can change how the remote moves the pointer.
function toggleTvPointerLock(){
  const locked = document.pointerLockElement || document.webkitPointerLockElement;
  if(locked){
    const exit = document.exitPointerLock || document.webkitExitPointerLock;
    if(exit){ try { exit.call(document); } catch(e){} }
    return;
  }
  const target = document.documentElement;
  const req = target.requestPointerLock || target.webkitRequestPointerLock;
  if(!req){ toast('Pointer Lock is not supported by this TV browser'); return; }
  try {
    const result = req.call(target);
    if(result && result.catch) result.catch(() => toast('Pointer Lock was blocked by this TV browser'));
  } catch(e){ toast('Pointer Lock could not be enabled'); }
}
addEventListener('pointerlockerror', () => toast('Pointer Lock failed on this TV browser'));
// Remote-friendly trigger: focus this on-screen control with the pointer or D-pad,
// then press OK/Enter. No physical P key or keyboard is required.
(function addRemotePointerLockButton(){
  const b = document.createElement('button');
  b.id = 'tvPointerLockTestBtn';
  b.className = 'f';
  b.type = 'button';
  b.textContent = 'Test cursor hide';
  b.setAttribute('aria-label', 'Test hiding the TV cursor');
  b.style.cssText = 'position:fixed;right:12px;bottom:12px;z-index:2147483647;padding:12px 16px;border:2px solid #fff;border-radius:8px;background:#20242c;color:#fff;font-size:16px;box-shadow:0 2px 12px #0008;';
  b.addEventListener('click', toggleTvPointerLock);
  document.body.appendChild(b);
})();

let tvFullscreenAttempted = false;
function requestTvFullscreen(){
  if(tvFullscreenAttempted) return;
  tvFullscreenAttempted = true;
  if(document.fullscreenElement || document.webkitFullscreenElement) return;
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen;
  if(req){
    try { const result = req.call(el); if(result && result.catch) result.catch(() => {}); } catch(e){}
  }
}
addEventListener('keydown', e => {
  // Ask for fullscreen after the first remote interaction; browser policy may reject it.
  requestTvFullscreen();
  const c = e.keyCode;
  const k = TV_KEYS[c] || e.key;
  const dk = $('#diagKey'); if(dk && dk.offsetParent) dk.textContent = 'Last key: key="' + e.key + '"  keyCode=' + c;
  // Leave browser shortcuts (Ctrl+R, F5, F11, ...) alone.
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(/^F\d+$/.test(k)) return;
  const act = document.activeElement, inInput = act && act.tagName === 'INPUT';
  const back = k === 'Escape' || k === 'BrowserBack' || c === 4 || c === 10009 || c === 461 || (k === 'Backspace' && !inInput);
  if(!$('#player').classList.contains('hidden')){
    const inCtrls = ctrlsOn() && act && act.closest && act.closest('#ctrls');
    const playPause = k === ' ' || k === 'MediaPlayPause' || c === 415 || c === 19;
    const menuOn = !$('#tracks').classList.contains('hidden');
    const nextOn = !$('#nextOverlay').classList.contains('hidden');
    const srcOn = !$('#streams').classList.contains('hidden');
    if(back){ if(nextOn){clearTimeout(nextTimer);$('#nextOverlay').classList.add('hidden');} else if(menuOn) closeMenu(); else if(srcOn) closeSources(); else closePlayer(); }
    else if(nextOn){ if(k==='ArrowUp') move('up'); else if(k==='ArrowDown') move('down'); else if(k==='Enter' && act) act.click(); }
    else if(menuOn){ if(k === 'ArrowUp') move('up'); else if(k === 'ArrowDown') move('down'); else if(k === 'Enter' && act) act.click(); }
    else if(srcOn){ if(k === 'ArrowUp') move('up'); else if(k === 'ArrowDown') move('down'); else if(k === 'Enter' && act) act.click(); }
    else if(playPause){ toggle(); showCtrls(); }
    else if(k === 'f' || k === 'F'){ toggleFullscreen(); showCtrls(); }
    else if(inCtrls){
      if(act.id === 'bar' && (k === 'ArrowLeft' || k === 'ArrowRight')) seek(k === 'ArrowLeft' ? -10 : 10);
      else if(k === 'ArrowLeft') move('left');
      else if(k === 'ArrowRight') move('right');
      else if(k === 'ArrowUp') move('up');
      else if(k === 'ArrowDown') move('down');
      else if(k === 'Enter') act.click();
      if(ctrlsOn()){ clearTimeout(ctrlT); ctrlT = setTimeout(hideCtrls, 4500); }
    }
    else if(k === 'Enter'){ toggle(); showCtrls(); }
    else if(k === 'ArrowRight' || c === 417){ seek(10); showCtrls(); }
    else if(k === 'ArrowLeft' || c === 412){ seek(-10); showCtrls(); }
    else if(k === 'ArrowUp' || k === 'ArrowDown'){ showCtrls(true); }
    e.preventDefault(); return;
  }
  if(back){ e.preventDefault(); goBack(); return; }
  const dir = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' }[k];
  if(dir){
    if(inInput && (dir === 'left' || dir === 'right')){
      // Move the caret inside the field; leave it only from the edge.
      const n = act.selectionStart, m = act.selectionEnd, len = (act.value || '').length;
      const atEdge = n === null || (n === m && (dir === 'left' ? n === 0 : n === len));
      if(!atEdge) return;
    }
    e.preventDefault(); move(dir);
  } else if(k === 'Enter'){
    if(act && act.id === 'q'){ search(act.value); }
    else if(act && act.classList.contains('f') && !inInput){ e.preventDefault(); act.click(); }
  }
});
$('#exitbtn').onclick = () => { try { window.close(); } catch(e){} setTimeout(() => toast('Press the Home button on your remote to leave'), 500); };
document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => b.dataset.go === 'home' ? home() : settings());

// Coolita remotes may control the browser as a mouse pointer instead of
// dispatching arrow-key events to the page. Keep DOM focus in sync with the
// item under that pointer, so OK/Enter activates the same item as D-pad mode.
let pointerFocusT = 0;
function focusPointerTarget(e){
  const t = e.target && e.target.closest ? e.target.closest('.f') : null;
  if(!t || !document.body.contains(t) || t.offsetParent === null) return;
  // Avoid repeated focus calls from high-frequency mousemove events.
  if(document.activeElement !== t){
    clearTimeout(pointerFocusT);
    pointerFocusT = setTimeout(() => {
      if(document.body.contains(t) && t.offsetParent !== null && document.activeElement !== t){
        try { t.focus({ preventScroll: true }); } catch(err) { t.focus(); }
      }
    }, 25);
  }
}
addEventListener('mousemove', focusPointerTarget, true);
addEventListener('mouseover', focusPointerTarget, true);
addEventListener('pointermove', focusPointerTarget, true);
// Some TV browsers report OK as a key but do not synthesize a DOM click.
// If the pointer is over a focusable app item, activate it on Enter as usual.
// Leaving the app (launcher takeover, screen off) must not leave the decoder
// running: on these boxes that is what produces a dead player on return.
document.addEventListener('visibilitychange', () => {
  if(!document.hidden) return;
  const v = $('#v');
  if(v && !v.paused){ try { v.pause(); } catch(e){} }
});

// ---------- start ----------
(async () => {
  // Paint a shell immediately so a slow or unreachable addon cannot leave the
  // screen blank while the manifests are fetched.
  launches = Number(store.get('launches', 0)) + 1; store.set('launches', launches);
  show('home'); homeBuilt = true;
  const shell = '<div id="hero" class="hero2 hidden"></div><div id="rows">';
  // A TV browser old enough to lack fetch() cannot reach any addon. Say so
  // instead of sitting on "Loading addons…" forever with no explanation.
  if(typeof fetch !== 'function'){
    $('#home').innerHTML = shell + '<div class="msg">This browser cannot load addons: it has no fetch() support.<br>Update the TV browser, or open the app in a newer one.</div></div>';
    return;
  }
  $('#home').innerHTML = shell + '<div class="msg">Loading addons…</div></div>';
  await loadAddons();
  home();
})();
</script>
